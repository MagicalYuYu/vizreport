<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3F4F6">
<title>示例 · 叙事报告模板（report）</title>
<!--
  ══════════════════════════════════════════════════════════════════
  AOS Research Showcase · report v1.5 (单文件数据岛 · 叙事报告布局)
  ──────────────────────────────────────────────────────────────────
  用法：只改 <script id="aos-data"> 里的 JSON，不改其余部分。
  布局路由：叙事报告/调研长文 → 本模板；清单/目录/游戏库 → cardwall.template.html
  块类型：h(level:1|2) / p / ul / stats / chart(bar|hbar|line|donut)
          / cards / table(排序+行筛选+列筛选) / callout / quote / img
  特性：零依赖 / file:// 直开 / 浅色默认+昼夜切换 / 粘滞目录树
        章节折叠 / 设置面板(localStorage 全局) / 图表悬浮详情
  字段说明：09_REFERENCE/research/2026-11-12_visual-showcase-standard.md
-->
<style>
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --card:#FFFFFF; --card-hi:#F8FAFC;
  --border:#D8DDE4; --border-hi:#A9B4C2;
  --text:#1B2430; --muted:#4B5563; --faint:#68737F;
  --accent:#16A34A; --accent-hi:#15803D; --accent-soft:rgba(22,163,74,.10);
  --cyan:#0284C7; --cyan-hi:#0369A1; --cyan-soft:rgba(2,132,199,.09);
  --amber:#D97706; --amber-hi:#B45309; --amber-soft:rgba(217,119,6,.09);
  --red:#DC2626; --red-hi:#B91C1C; --red-soft:rgba(220,38,38,.07);
  --glow:rgba(22,163,74,.05); --bar-bg:rgba(243,244,246,.94); --rail-bg:rgba(255,255,255,.92);
  --ch1:#16A34A; --ch2:#0284C7; --ch3:#D97706; --ch4:#DC2626; --ch5:#0F766E; --ch6:#64748B;
  --mono:"Fira Code","Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
  --sans:"Fira Sans","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#020617; --surface:#0B1120; --card:#0E1223; --card-hi:#141B30;
  --border:#26304A; --border-hi:#3D4A6B;
  --text:#F8FAFC; --muted:#94A3B8; --faint:#64748B;
  --accent:#22C55E; --accent-hi:#4ADE80; --accent-soft:rgba(34,197,94,.13);
  --cyan:#38BDF8; --cyan-hi:#7DD3FC; --cyan-soft:rgba(56,189,248,.10);
  --amber:#F59E0B; --amber-hi:#FBBF24; --amber-soft:rgba(245,158,11,.12);
  --red:#EF4444; --red-hi:#FCA5A5; --red-soft:rgba(239,68,68,.10);
  --glow:rgba(34,197,94,.055); --bar-bg:rgba(2,6,23,.94); --rail-bg:rgba(11,17,32,.92);
  --ch1:#22C55E; --ch2:#38BDF8; --ch3:#F59E0B; --ch4:#EF4444; --ch5:#14B8A6; --ch6:#94A3B8;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
body{
  font-family:var(--sans);
  background-color:var(--bg);
  background-image:radial-gradient(1100px 460px at 50% -8%, var(--glow), transparent 62%);
  background-repeat:no-repeat;
  color:var(--text);
  font-size:1rem;
  line-height:1.6;
  min-height:100vh;
}
a{color:var(--cyan-hi)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
::selection{background:rgba(22,163,74,.25)}
.stat-tile .v,.fs-pct,.rpt-stats .v{font-variant-numeric:tabular-nums}
:where(button,a):focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:6px}

/* ── header ─────────────────────────────────────── */
header.top{border-bottom:1px solid var(--border);background:var(--bar-bg);padding:34px 0 26px}
.brand{font-family:var(--mono);font-size:.88rem;letter-spacing:.03em;color:var(--faint);display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand .logo{color:var(--accent-hi);font-size:1rem;letter-spacing:0}
h1{font-family:var(--mono);font-size:clamp(1.25rem,2.6vw,1.55rem);font-weight:600;letter-spacing:-.01em;line-height:1.3}
h1 .cursor{color:var(--accent-hi);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.subtitle{color:var(--muted);margin-top:8px;max-width:70ch}
.meta-badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.related{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.related .rl{font-family:var(--mono);font-size:.78rem;color:var(--faint)}
.rchip{font-family:var(--mono);font-size:.82rem;color:var(--cyan-hi);background:var(--cyan-soft);border:1px solid var(--border);border-radius:7px;padding:5px 12px;text-decoration:none;transition:border-color .15s,color .15s}
.rchip:hover{color:var(--text);border-color:var(--cyan)}
.badge{font-family:var(--mono);font-size:.9rem;padding:5px 12px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:var(--surface)}
.badge.b-accent{color:var(--accent-hi);border-color:var(--accent);background:var(--accent-soft)}
.badge.b-cyan{color:var(--cyan-hi);border-color:var(--cyan);background:var(--cyan-soft)}

/* ── layout + sticky toc tree ───────────────────── */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:46px;padding:28px 0 10px;align-items:start}
.toc{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;scrollbar-width:thin;font-size:.88rem;padding-right:4px}
.toc .t{font-family:var(--mono);font-size:.78rem;letter-spacing:.03em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.toc-tools{display:flex;gap:6px;margin-bottom:10px}
.toc-tools button{flex:1;font-family:var(--mono);font-size:.75rem;padding:4px 0;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.toc-tools button:hover{color:var(--text);border-color:var(--border-hi)}
.toc-drag{cursor:grab;user-select:none}
.toc-drag:active{cursor:grabbing}
.toc-drag .drag-handle{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:8px;height:36px;background:repeating-linear-gradient(180deg,var(--border) 0 2px,transparent 2px 5px);border-radius:3px;opacity:.4;transition:opacity .15s}
.toc-drag:hover .drag-handle{opacity:.9}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:5px 10px;border-left:2px solid var(--border);transition:color .15s,border-color .15s;overflow-wrap:anywhere}
.toc a:hover{color:var(--text);border-color:var(--border-hi)}
.toc a.cur{color:var(--accent-hi);border-color:var(--accent)}
.toc .tw{cursor:pointer;color:var(--faint);font-family:var(--mono);margin-right:4px;display:inline-block;width:12px;text-align:center}
.toc .tw:hover{color:var(--text)}
.toc-no{font-family:var(--mono);font-size:.75rem;color:var(--faint);margin-right:4px;flex:none}
.toc a.lv2{padding:3px 10px 3px 30px;font-size:.84rem}
.toc .grp.closed a.lv2{display:none}
.toc .grp > a.lv1{display:flex;align-items:baseline}
.toc .grp > a.lv1 .tw{flex:none}
@media (max-width:980px){
  .layout{grid-template-columns:1fr;gap:0}
  .toc{position:static;max-height:none;overflow:visible;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:12px 14px;margin-bottom:22px}
  .toc a{display:inline-block;border:0;padding:4px 10px 4px 0;margin-right:10px}
  .toc .grp.closed a.lv2{display:none}
}
/* ── 布局模式（v1.8.2）：--main-w 纯像素 + 响应式钳制（线性 1:1 映射）── */
@media (min-width:981px){
  .layout{max-width:none;grid-template-columns:250px minmax(0,min(var(--main-w,1100px),calc(100vw - 360px)));justify-content:center}
  .layout::after{content:'';grid-column:3;width:250px}
}
@media (min-width:981px){
  body.lay-integ .layout{grid-template-columns:250px minmax(0,1fr);justify-content:start;max-width:min(var(--main-w,1100px),calc(100vw - 360px))}
  body.lay-integ .layout::after{display:none}
}
@media (min-width:981px){
  body.lay-side .layout{grid-template-columns:minmax(0,min(var(--main-w,1100px),calc(100vw - 360px)));justify-content:center}
  body.lay-side .layout::after{display:none}
}
body.lay-side .toc{position:static;max-height:none;overflow:visible;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:12px 14px;margin-bottom:22px}
@media (min-width:1500px){
  body.lay-side .toc{position:fixed;left:18px;top:80px;width:236px;max-height:calc(100vh - 110px);overflow-y:auto;margin-bottom:0}
}

/* ── blocks ─────────────────────────────────────── */
.rpt-main{min-width:0;overflow-x:hidden}
.sec-body{padding-left:2px}
.sec.collapsed .sec-body{display:none}
.rpt-h{display:flex;align-items:baseline;font-family:var(--mono);font-size:1.15rem;font-weight:600;margin:38px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);scroll-margin-top:20px;cursor:pointer;user-select:none}
.rpt-h .no{color:var(--accent-hi);margin-right:10px;font-size:.95rem}
.rpt-h .chev{font-family:var(--mono);font-size:.8rem;color:var(--faint);margin-left:auto;transition:transform .15s}
.sec.collapsed .rpt-h .chev{transform:rotate(-90deg)}
.rpt-h.sub{font-size:1.02rem;margin:28px 0 10px;border-bottom:1px dashed var(--border);padding-bottom:6px}
.rpt-h.sub .no{font-size:.85rem}
.rpt-p{font-size:1.02rem;line-height:1.85;color:var(--text);margin:12px 0}
.rpt-p code,.rpt-li code,.callout code{font-family:var(--mono);font-size:.88rem;color:var(--cyan-hi);background:var(--cyan-soft);border:1px solid var(--border);border-radius:4px;padding:1px 6px;overflow-wrap:anywhere}
.rpt-ul{margin:12px 0 12px 4px;list-style:none}
.rpt-li{position:relative;padding:4px 0 4px 24px;line-height:1.75;font-size:1rem;color:var(--text)}
.rpt-li::before{content:"▸";position:absolute;left:4px;color:var(--accent-hi);font-family:var(--mono);font-size:.85rem}
.rpt-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:20px 0}
.rpt-stats .tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.rpt-stats .k{font-family:var(--mono);font-size:.8rem;color:var(--faint)}
.rpt-stats .v{font-family:var(--mono);font-size:1.35rem;font-weight:600;margin-top:4px}
.rpt-stats .s{font-size:.85rem;color:var(--muted);margin-top:2px;overflow-wrap:break-word;word-break:break-all;line-height:1.5}
.rpt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:20px 0}
.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;transition:border-color .15s,transform .15s}
.mini-card:hover{border-color:var(--border-hi);transform:translateY(-2px)}
.mini-card h4{font-size:1rem;font-weight:600}
.mini-card h4 a{color:var(--text);text-decoration:none}
.mini-card h4 a:hover{color:var(--accent-hi)}
.mini-card p{font-size:.9rem;color:var(--muted);margin-top:5px;line-height:1.6}
.mini-card .mtags{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
.mtag{font-family:var(--mono);font-size:.78rem;color:var(--cyan-hi);background:var(--cyan-soft);border:1px solid var(--border);border-radius:5px;padding:2px 8px}

/* ── table：排序 + 行筛选 + 列筛选（v1.5 F14）── */
.tbl-filter{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;background:var(--card-hi);padding:8px 14px;flex-wrap:wrap}
.tbl-filter input{flex:1;min-width:120px;border:0;outline:0;background:none;color:var(--text);font-family:var(--mono);font-size:.85rem}
.tbl-filter .n{font-family:var(--mono);font-size:.78rem;color:var(--faint);white-space:nowrap}
.tbl-filter .reset-btn{border:0;background:none;color:var(--accent-hi);font-family:var(--mono);font-size:.78rem;cursor:pointer;padding:2px 4px;white-space:nowrap}
.tbl-filter .reset-btn:hover{text-decoration:underline}
.tbl-filter + .rpt-table-wrap{border-radius:0 0 var(--radius) var(--radius);margin-top:0}
.rpt-table-wrap{overflow-x:auto;margin:20px 0;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.rpt-table{width:100%;border-collapse:collapse;font-size:.92rem}
.rpt-table th{position:relative;font-family:var(--mono);font-size:.82rem;text-align:left;color:var(--muted);background:var(--card-hi);border-bottom:1px solid var(--border);padding:10px 14px;white-space:nowrap}
.rpt-table th.sortable{cursor:pointer;user-select:none;transition:color .15s}
.rpt-table th.sortable:hover{color:var(--text)}
.rpt-table th .si{font-size:.7rem;margin-left:5px;color:var(--accent-hi)}
.th-extra{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center}
.cf-btn{border:0;background:none;color:var(--faint);cursor:pointer;font-size:.78rem;padding:2px 4px;border-radius:4px;font-family:var(--mono)}
.cf-btn:hover{color:var(--text)}
.cf-btn.on{color:var(--accent-hi)}
.cf-pop{position:fixed;z-index:75;background:var(--rail-bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 14px rgba(15,23,42,.16);padding:10px 12px;min-width:190px;max-width:280px;max-height:280px;overflow:auto;font-size:.85rem;display:none}
.cf-pop.open{display:block}
.cf-pop label{display:flex;gap:8px;align-items:center;padding:4px 0;color:var(--text);cursor:pointer}
.cf-pop .cf-cap{font-family:var(--mono);font-size:.75rem;color:var(--faint);margin-bottom:6px}
.cf-pop .cf-foot{display:flex;gap:6px;margin-top:8px;position:sticky;bottom:-10px;background:var(--rail-bg);padding-top:6px}
.cf-pop .cf-foot button{flex:1;font-family:var(--mono);font-size:.75rem;padding:4px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.rpt-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top}
.rpt-table tr:last-child td{border-bottom:0}
.rpt-table .num{font-variant-numeric:tabular-nums;font-family:var(--mono)}

/* ── chart（纯 SVG + 悬浮详情 + 排序切换，v1.5 F13）── */
.rpt-chart{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:16px 18px;margin:20px 0;overflow:hidden;max-width:100%}
.rpt-chart svg{width:100%;height:auto;display:block}
.rpt-chart svg [data-t1]{cursor:default}
.rpt-chart text{font-family:var(--mono);pointer-events:none}
.rpt-chart .cap{font-family:var(--mono);font-size:.82rem;color:var(--faint);margin-bottom:10px}
.rpt-chart .tools{display:flex;justify-content:flex-end;margin:-4px 0 6px;gap:6px}
.rpt-chart .tools button{font-family:var(--mono);font-size:.75rem;padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.rpt-chart .tools button:hover{color:var(--text)}
.rpt-chart .axis{stroke:var(--border);stroke-width:1}
.rpt-chart .gridline{stroke:var(--border);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.rpt-chart .vlab,.rpt-chart .xlab{fill:var(--muted);font-size:15px}
.rpt-chart .cval{fill:var(--text);font-size:16px;font-weight:600}
.rpt-chart .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.rpt-chart .legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.chart-tip{position:fixed;z-index:80;pointer-events:none;background:var(--rail-bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 14px rgba(15,23,42,.2);padding:8px 12px;font-family:var(--mono);font-size:.8rem;color:var(--text);max-width:300px;display:none;line-height:1.7}
.chart-tip .tk{color:var(--accent-hi);font-weight:600}
.chart-tip .td2{color:var(--muted)}

/* ── img 块（v1.5 F12）── */
.rpt-fig{margin:20px 0;text-align:center}
.rpt-fig img{max-width:520px;width:auto;border:1px solid var(--border);border-radius:var(--radius);display:block;margin:0 auto;cursor:zoom-in}
.rpt-fig figcaption{font-family:var(--mono);font-size:.82rem;color:var(--faint);margin-top:8px;overflow-wrap:anywhere;text-align:center}
.rpt-fig .imgfail{border:1px dashed var(--border);border-radius:var(--radius);padding:36px 20px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:.88rem;background:var(--surface)}
.rpt-fig.wide img{width:100%;max-width:none}

/* ── mindmap 块（v1.9：纯 HTML/CSS，文字自适应换行，根治 SVG 截断）── */
.mm-wrap{display:flex;gap:0;align-items:center;min-height:100%}
.mm-center{flex:none;width:160px;padding:14px 16px;border:2px solid var(--accent);border-radius:12px;background:var(--accent-soft);font-family:var(--mono);font-size:.95rem;font-weight:600;text-align:center;color:var(--accent-hi)}
.mm-spine{flex:none;width:2px;background:var(--border);align-self:stretch;margin:0 0}
.mm-branches{flex:1;display:flex;flex-direction:column;gap:10px;padding-left:24px;border-left:2px solid var(--border)}
.mm-branch{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;padding:4px 0}
.mm-blabel{font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--text);padding:4px 12px;border-radius:7px;border:1.5px solid var(--bc,var(--ch1));flex:none}
.mm-kid{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding:3px 9px;border-radius:5px;background:var(--surface);border:1px solid var(--border);white-space:normal;overflow-wrap:anywhere}
.rpt-chart .scrollx{overflow-x:auto}
.rpt-chart .scrollx svg{min-width:640px}
.tl-node rect,.fl-box rect,.mm-box rect{rx:6}
.mm-chip{font-size:13px}
.fl-arrow{stroke:var(--border-hi);stroke-width:2;fill:none}

.callout{border:1px solid;border-left-width:4px;border-radius:8px;padding:14px 18px;margin:20px 0;font-size:.95rem;line-height:1.75}
.callout.ok{border-color:var(--accent);background:var(--accent-soft)}
.callout.warn{border-color:var(--amber);background:var(--amber-soft)}
.callout.danger{border-color:var(--red);background:var(--red-soft)}
.callout.info{border-color:var(--cyan);background:var(--cyan-soft)}
.callout .ct{font-family:var(--mono);font-size:.85rem;font-weight:600;margin-bottom:4px}
.callout.ok .ct{color:var(--accent-hi)}.callout.warn .ct{color:var(--amber-hi)}
.callout.danger .ct{color:var(--red-hi)}.callout.info .ct{color:var(--cyan-hi)}
.rpt-quote{border-left:3px solid var(--border-hi);padding:6px 0 6px 20px;margin:20px 0;color:var(--muted);font-size:1rem;line-height:1.8}
.rpt-quote .qc{display:block;margin-top:6px;font-family:var(--mono);font-size:.82rem;color:var(--faint)}

/* ── footer / rail / settings ───────────────────── */
footer{border-top:1px solid var(--border);margin-top:34px;padding:24px 0 44px;color:var(--faint);font-size:.9rem}
footer .fnote{font-family:var(--mono);font-size:.88rem;line-height:1.8;overflow-wrap:anywhere}
footer .fmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.edge-rail{position:fixed;right:14px;bottom:16px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px}
.rail-box{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--rail-bg);border:1px solid var(--border);border-radius:12px;padding:5px 5px 6px;backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(15,23,42,.08)}
.rail-btn{display:flex;align-items:center;justify-content:center;width:38px;height:34px;border-radius:8px;border:0;background:none;color:var(--muted);font-family:var(--mono);font-size:.95rem;cursor:pointer;transition:color .15s,background .15s}
.rail-pct{font-family:var(--mono);font-size:.7rem;color:var(--faint);line-height:1.2;min-width:40px;text-align:center}
.back-top{display:flex;align-items:center;justify-content:center;width:44px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--rail-bg);color:var(--muted);cursor:pointer;backdrop-filter:blur(8px);transition:color .15s,border-color .15s;font-size:.9rem;box-shadow:0 2px 10px rgba(15,23,42,.08)}
@media screen{
  .rail-btn:hover:not(:disabled){color:var(--text);background:rgba(120,130,145,.15)}
  .back-top:hover{color:var(--text);border-color:var(--border-hi)}
}
.rail-btn:disabled{opacity:.35;cursor:default}
.settings-pop{position:fixed;right:64px;bottom:16px;z-index:70;width:min(320px,calc(100vw - 80px));background:var(--rail-bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 14px rgba(15,23,42,.16);backdrop-filter:blur(10px);padding:14px 16px;display:none;overflow-y:auto;max-height:calc(100vh - 40px)}
.settings-pop.open{display:block}
.settings-pop .st{font-family:var(--mono);font-size:.75rem;letter-spacing:.03em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
.settings-pop label{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;font-size:.85rem;color:var(--text);border-bottom:1px dashed var(--border);flex-wrap:nowrap;white-space:nowrap}
.settings-pop label:last-of-type{border-bottom:0}
.settings-pop select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;height:30px;font-size:.85rem;padding:0 6px}
.settings-pop .foot{margin-top:10px}
.settings-pop .foot button{width:100%;font-family:var(--mono);font-size:.8rem;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.settings-pop .foot button:hover{color:var(--text)}
.settings-pop .hint{font-family:var(--mono);font-size:.8rem;color:var(--faint);margin-top:8px;line-height:1.6}
.noscript-note{padding:20px;font-family:var(--mono);color:var(--amber-hi)}
@media (max-width:640px){ .rpt-p,.rpt-ul{font-size:.98rem} }
@media print{
  body{background:#fff;color:#111;font-size:.75rem}
  header.top{background:#fff}
  .edge-rail,.settings-pop,.chart-tip,.cf-pop{display:none!important}
  .toc{display:none}
  .layout{display:block}
  .sec.collapsed .sec-body{display:block!important}
  .rpt-h,.rpt-p,.rpt-ul,.rpt-stats .v{color:#111}
  .rpt-p,.rpt-li,.callout,.rpt-quote{color:#243}
  .rpt-stats .tile,.mini-card,.rpt-table-wrap,.rpt-chart,.rpt-fig img{background:#fff;border-color:#c9ced9}
  .rpt-table th{color:#3f4658;background:#f3f4f6}
  .rpt-li::before,.rpt-h .no{color:#15803d}
  a{color:#0c7db3}
}
